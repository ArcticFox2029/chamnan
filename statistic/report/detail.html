<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>statistics · what fires, what breaks</title>
<link rel="stylesheet" href="app.css">
</head><body>
<header></header>
<main id="main"></main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
head(2);
const M = document.getElementById("main");

/* ---- which features actually fire. A feature with no recorder is drawn GREY with the reason,
   never omitted: an empty row that explains itself is how the missing recorder gets built, and
   leaving it out would make the page claim a coverage it does not have. */
const feats = S.features || [];
const live = feats.filter((f) => f.source);
const dark = feats.filter((f) => !f.source);
M.append(panel("which chamnan features actually fire",
  "how many chances each had, and how many times it spoke",
  "logs/*.jsonl, one per feature",
  [
    table(["feature", { t: "spoke", n: 1 }, { t: "chances", n: 1 }, { t: "rate", n: 1 }, ""],
      live.map((f) => [f.feature, { t: n(f.fired), n: 1 }, { t: n(f.chances), n: 1 },
        { t: pct(f.fired, f.chances).toFixed(1) + "%", n: 1 },
        bar(pct(f.fired, f.chances), f.fired ? "" : "grey")])),
    dark.length ? el("p", { class: "note" },
      `${dark.length} guard(s) have NO recorder at all — they print and forget: `
      + dark.map((f) => f.feature).join(", ")
      + ". Nothing can say whether they have ever fired.") : null,
  ], { wide: true }));

/* ---- how often something is actually found */
const fd = S.found || {};
M.append(panel("how often something is found",
  "gate runs, newest first — checks run and checks failing",
  "logs/gate_runs.jsonl",
  table(["day", { t: "checks", n: 1 }, { t: "failing", n: 1 }, { t: "seconds", n: 1 }],
    newestFirst(fd.gate_runs || [], "day").slice(0, 8).map((g) =>
      [g.day, { t: n(g.checks), n: 1 }, { t: n(g.failing), n: 1 }, { t: n(g.seconds), n: 1 }]))));

M.append(panel("guards that have proved they can fail",
  "a test existing is not an invariant being proved — this is the share with a recorded mutation proof",
  "state/mutation_proofs.json · tools/checks/",
  [
    el("p", { class: "big" }, `${n(fd.mutation_proved)} / ${n(fd.guard_pool)}`),
    bar(pct(fd.mutation_proved || 0, fd.guard_pool || 1)),
  ]));

/* ---- the model's own mistakes */
const ms = S.mistakes || {};
M.append(panel("the model's own mistakes",
  "failures recorded, and how many were a REPEAT of an identical earlier one",
  "logs/failures.jsonl via lib/gotcha.py · state/gotcha_marks.json",
  [
    el("p", { class: "big" }, `${n(ms.failures)} recorded · ${n(ms.repeats)} repeated`),
    (ms.per_day || []).length
      ? table(["day", { t: "failures", n: 1 }, { t: "repeats", n: 1 }],
          newestFirst(ms.per_day, "day").slice(0, 8).map((d) =>
            [d.day, { t: n(d.failures), n: 1 }, { t: n(d.repeats), n: 1 }]))
      : null,
    fd.recorded_lessons !== undefined
      ? el("p", { class: "sub" }, `${n(fd.recorded_lessons)} lesson(s) written into the code so far`)
      : null,
    ms.note ? el("p", { class: "note" }, ms.note) : null,
  ], { wide: true, off: !(ms.failures) }));

/* ---- which files keep being edited. Edited often is NOT fragile: a file under active
   development is edited often and is fine. The gotcha column beside it is what separates them. */
M.append(panel("which files keep being edited",
  "edited often is not the same as fragile — the recorded-lessons column is what separates them",
  "logs/edits.jsonl · logs/pointer.jsonl · 🐛 markers in the file itself",
  table(["file", { t: "edits", n: 1 }, { t: "opens", n: 1 }, { t: "lessons", n: 1 }],
    (S.files || []).slice(0, 20).map((f) =>
      [el("code", {}, f.path), { t: n(f.edits), n: 1 }, { t: n(f.opens), n: 1 },
       { t: n(f.lessons), n: 1 }])), { wide: true }));

/* ---- the local model */
M.append(panel("the local model",
  "calls it answered, and the characters a session did not have to read",
  "state/local_assist/daily/*.jsonl — the corrected figure (report minus extract, counted once)",
  table(["day", { t: "calls", n: 1 }, { t: "chars not read", n: 1 }],
    newestFirst(S.local || [], "day").slice(0, 10).map((d) =>
      [d.day, { t: n(d.calls), n: 1 }, { t: n(d.chars), n: 1 }])), { wide: true }));
</script>
</body></html>
