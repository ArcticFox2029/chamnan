<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>statistics · impact</title>
<link rel="stylesheet" href="app.css">
</head><body>
<header></header>
<main id="main"></main>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const P = readPeriod();
head(1, P);
const M = document.getElementById("main");
const row = currentRow(P) || {};
const rows = periodRows(P);
const grain = P.grain === "day" ? "day" : "month";
const grainTh = P.grain === "day" ? "วัน" : "เดือน";

/* ---- the question this page exists to answer: what is different with the plugin, and without it.
   🔴 Counted as EVENTS, never as a saving. Nothing here knows what a session without the plugin
   would have cost, and a page that guesses it cannot be trusted about anything else either. */
const im = S.impact || { rows: [] };
M.append(panel("with it, and without it",
  "ความต่างระหว่างมีปลั๊กอินกับไม่มี",
  [...new Set((im.rows || []).map((r) => r.source))].join(" · "),
  [
    hbars((im.rows || []).map((r, i) => ({
      label: r.what, th: r.th, value: r.with, text: short(r.with),
      colour: PAL[i % PAL.length], dim: !r.with,
    }))),
    el("p", { class: "note" }, im.note),
    el("p", { class: "th" }, im.note_th),
  ], { wide: true }));

M.append(panel("what would have happened instead",
  "ถ้าไม่มีปลั๊กอิน สิ่งที่จะเกิดขึ้นแทน",
  "the same rows, read the other way round",
  table([{ t: "instead of that" }, { t: "count", n: 1 }],
    (im.rows || []).map((r) => [r.without, { t: short(r.with), n: 1 }])), { wide: true }));

/* ---- the period's own shape, so the picker has something to change */
const f = (k) => rows.map((r) => r[k] || 0);
M.append(panel(`activity over ${rows.length} ${grain}(s)`,
  `กิจกรรมย้อนหลัง ${rows.length} ${grainTh}`,
  "logs/commands.jsonl · logs/pointer.jsonl · logs/edits.jsonl",
  [
    el("div", { class: "grid2" },
      stat(short(row.commands || 0), "commands", "คำสั่ง"),
      stat(short(row.opens || 0), "files opened", "ไฟล์ที่เปิด"),
      stat(short(row.edits || 0), "files changed", "ไฟล์ที่แก้")),
    spark(f("commands")),
    el("p", { class: "src" }, `kept for ${(S.series || {}).keep_months || 12} months`),
  ]));

/* ---- what kind of tokens. No vendor, no price: the SPLIT is what is true on every host. */
const tk = S.token_kinds || { kinds: [] };
M.append(panel("what kind of tokens",
  "โทเค็นแต่ละชนิด",
  `transcripts on this machine · ${n(tk.requests)} request(s)`,
  [
    donut((tk.kinds || []).map((k) => ({ label: k.kind.replace(/_/g, " "), value: k.tokens })),
      { centre: short((tk.kinds || []).reduce((a, k) => a + k.tokens, 0)), sub: "tokens" }),
    el("p", { class: "note" },
      "a cached read is the cheapest kind of token wherever caching exists — no rate and no price "
      + "is shown, because this plugin does not know which model you run or whether it is local"),
    el("p", { class: "th" }, "ไม่แสดงราคาหรือชื่อโมเดล เพราะปลั๊กอินไม่รู้ว่าคุณใช้ค่ายไหน หรือรันในเครื่อง"),
  ]));

/* ---- what the repository itself puts in front of a session */
const cp = (S.context_parts || []).filter((c) => c.tokens !== null);
const unknown = (S.context_parts || []).filter((c) => c.tokens === null);
M.append(panel("what this repository puts in front of a session",
  "สิ่งที่ repo นี้ใส่เข้า context ทุกครั้งที่เปิด session",
  "CLAUDE.md · .claude/agents · .chamnan/skills · logs/block_shape.jsonl",
  [
    donut(cp.map((c) => ({ label: c.part, value: c.tokens })),
      { centre: short(cp.reduce((a, c) => a + c.tokens, 0)), sub: "tokens" }),
    unknown.length ? el("p", { class: "note" },
      unknown.map((c) => c.part).join(", ") + " — not on disk, so not counted here") : null,
    unknown.length ? el("p", { class: "th" }, "ส่วนของโฮสต์ไม่ได้อยู่บนดิสก์ จึงไม่ถูกนับ") : null,
  ]));

/* ---- the block itself */
const bl = S.block || { sections: [] };
M.append(panel("the block this plugin injects",
  "บล็อกที่ปลั๊กอินฉีดเข้าไปตอนเปิด session",
  "logs/block_shape.jsonl — `sec` and `srcs`",
  [
    el("div", { class: "grid2" },
      stat(short(bl.bytes || 0), "bytes, last assembly", "ไบต์ ครั้งล่าสุด"),
      stat(short(bl.tok || 0), "tokens", "โทเค็น"),
      stat(String((bl.sections || []).length), "sections", "หัวข้อ")),
    stackbar((bl.sections || []).map((s) => ({ label: s.title, value: s.bytes }))),
    hbars((bl.sections || []).slice(0, 6).map((s, i) => ({
      label: s.title, value: s.bytes, text: short(s.bytes), colour: PAL[i % PAL.length] }))),
  ], { wide: true }));
</script>
</body></html>
