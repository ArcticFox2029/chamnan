# The regression suite, on the platforms and Python versions the README claims.
#
# It exists to settle two claims that were, until now, only asserted there: that Linux works
# ("expected to work, not tested"), and that 3.8 is really the floor. chamnan's front page says
# "verifiable claims, not adjectives"; a support matrix nobody runs is an adjective.
#
# No dependency step on purpose. chamnan is standard library only, and if this file ever needs a
# `pip install`, that is the change to reject rather than the workflow to fix.
#
# Windows is HERE now, and that is a change of claim rather than of configuration. It used to be
# absent because the hooks are invoked as bare paths relying on a shebang and an executable bit,
# neither of which Windows has -- so running it would have reported a defect where there was a
# documented limitation. `bin/*.cmd` and `hooks/*.cmd` shims exist since, so the claim is now
# testable, and an untested claim is the thing this file was written to stop.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor the README declares, and the newest. The versions between are the same code
        # path; running all of them would buy repetition rather than coverage.
        python: ["3.8", "3.13"]
        exclude:
          # macOS runners are arm64 and have no 3.8 build; the floor is checked on Linux.
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Identify to git
        # Several tests build a real repository and commit into it. A runner has no global
        # identity, and `git commit` fails outright without one.
        run: |
          git config --global user.email "tests@chamnan.invalid"
          git config --global user.name "chamnan tests"
          git config --global init.defaultBranch main

      - name: Every file compiles
        run: python -m compileall -q lib bin hooks tests

      - name: Regression suite
        run: python tests/run_tests.py

      - name: Index this repository with the build under test
        # The suite checks the parts; this checks that the whole thing runs end to end on a tree it
        # did not construct itself, which is how the roll-up and mapper bugs of the last two
        # releases were actually found.
        #
        # The size assertion is Python rather than `test -s`: cmd.exe has no `test`, and a step
        # that silently does nothing on one platform is the shape of an untested claim.
        run: |
          python bin/chamnan-map
          python -c "import sys,pathlib; p=pathlib.Path('.chamnan/MAP.md'); sys.exit(0 if p.is_file() and p.stat().st_size > 0 else 'MAP.md is missing or empty')"

      - name: Windows shims are current and actually run
        if: runner.os == 'Windows'
        # The whole reason Windows is in this matrix. `chamnan-map` has no extension and starts
        # with a POSIX shebang, so cmd.exe cannot run it; `chamnan-map.cmd` beside it can. This
        # runs the shim the way a user would -- by name, through the shell -- rather than by
        # handing the script to an interpreter, which would prove nothing about the shim.
        shell: cmd
        run: |
          python install\make_windows_shims.py --check
          bin\chamnan-map.cmd --help
          bin\chamnan-context.cmd --detect .

      - name: The preflight runs where there is no POSIX shell
        if: runner.os == 'Windows'
        shell: cmd
        run: install\chamnan-check.cmd
