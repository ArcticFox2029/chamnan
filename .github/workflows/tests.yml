# The regression suite, on the platforms and Python versions the README claims.
#
# It exists to settle two claims that were, until now, only asserted there: that Linux works
# ("expected to work, not tested"), and that 3.8 is really the floor. chamnan's front page says
# "verifiable claims, not adjectives"; a support matrix nobody runs is an adjective.
#
# No dependency step on purpose. chamnan is standard library only, and if this file ever needs a
# `pip install`, that is the change to reject rather than the workflow to fix.
#
# Windows is HERE now, and that is a change of claim rather than of configuration. It used to be
# absent because the hooks are invoked as bare paths relying on a shebang and an executable bit,
# neither of which Windows has -- so running it would have reported a defect where there was a
# documented limitation. `bin/*.cmd` and `hooks/*.cmd` shims exist since, so the claim is now
# testable, and an untested claim is the thing this file was written to stop.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor the README declares, and the newest. The versions between are the same code
        # path; running all of them would buy repetition rather than coverage.
        #
        # "3.8" is NOT the same interpreter on every OS, and nothing here says so otherwise.
        # setup-python resolves it to the newest matching build per platform, and
        # actions/python-versions stops at DIFFERENT patches (read off the live manifest
        # 2026-09-07, not from memory):
        #
        #     linux-x64 / linux-arm64 / darwin-x64   3.8.18
        #     win32-x64 / win32-x86 / darwin-arm64   3.8.10
        #
        # So the Windows floor job tests against a build eight patches older than the Linux one.
        # That is not a failure -- win32 3.8.10 is still published, so the job resolves and runs --
        # but "tested at 3.8" means two different things across this matrix, and a future reader
        # comparing a Windows-only failure against the Linux job should know that before assuming
        # the difference is the OS (R12 agent 3, re-measured here).
        python: ["3.8", "3.13"]
        exclude:
          # macOS runners are arm64 and the floor is checked on Linux.
          #
          # The reason written here used to be "arm64 has no 3.8 build", and that is not what the
          # manifest says: darwin-arm64 publishes 3.8.10, same as Windows. The exclusion is kept
          # because the floor only needs proving once and Linux is where it is proven, which is a
          # cost argument rather than an availability one -- worth stating correctly, since the
          # wrong reason is the kind that gets "fixed" by someone who checks it.
          - os: macos-latest
            python: "3.8"
    steps:
      # v4 is the LAST major built on Node 20, and GitHub removes Node 20 from the runners on
      # 2026-09-23 — after which a Node-20 action does not resolve and this whole five-job matrix
      # stops running on every push. The runner already shims it onto Node 24 with a warning, and
      # that warning is in chamnan's own CI log from 2026-09-07:
      #   "Node 20 is being deprecated. This workflow is running with Node 24 by default."
      # v5 is the first major on node24 (confirmed against the tag's own action.yml, not the
      # release notes) and the smallest jump that survives the date.
      - uses: actions/checkout@v5
        with:
          # actions/checkout defaults to a depth-1 clone with no tags, so `git describe
          # --tags` finds nothing and the suite's version-drift check — the one its own
          # comment calls "the entire safety net" — skipped itself on every CI run, on all
          # three platforms, without saying so. Found by R1 agent 3.
          fetch-depth: 0

      # Same deadline, same reasoning: v5 is the last major on Node 20, v6 the first on node24.
      # v7 exists and its release notes say "Remove EOL Python versions", which is about the
      # action's own test fixtures rather than what it can install — but the matrix below still
      # needs 3.8, and taking the smaller jump means that claim does not have to be right.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Identify to git
        # Several tests build a real repository and commit into it. A runner has no global
        # identity, and `git commit` fails outright without one.
        run: |
          git config --global user.email "tests@chamnan.invalid"
          git config --global user.name "chamnan tests"
          git config --global init.defaultBranch main

      - name: Every file compiles
        # NOT `compileall`: it finds source by SUFFIX, and every chamnan command is an
        # extensionless file with a shebang. That blind spot let a broken `bin/chamnan-map` — a
        # duplicated keyword argument from an automated edit — pass this step and reach a commit.
        # `tests/compile_all.py` reads and compiles each file instead, which is the only way to
        # cover the ten commands. Reading rather than importing, because several run work on import.
        run: python tests/compile_all.py

      - name: Regression suite
        run: python tests/run_tests.py

      - name: Index this repository with the build under test
        # The suite checks the parts; this checks that the whole thing runs end to end on a tree it
        # did not construct itself, which is how the roll-up and mapper bugs of the last two
        # releases were actually found.
        #
        # The size assertion is Python rather than `test -s`: cmd.exe has no `test`, and a step
        # that silently does nothing on one platform is the shape of an untested claim.
        run: |
          python bin/chamnan-map
          python -c "import sys,pathlib; p=pathlib.Path('.chamnan/MAP.md'); sys.exit(0 if p.is_file() and p.stat().st_size > 0 else 'MAP.md is missing or empty')"

      - name: Windows shims are current and actually run
        if: runner.os == 'Windows'
        # The whole reason Windows is in this matrix. `chamnan-map` has no extension and starts
        # with a POSIX shebang, so cmd.exe cannot run it; `chamnan-map.cmd` beside it can. This
        # runs the shim the way a user would -- by name, through the shell -- rather than by
        # handing the script to an interpreter, which would prove nothing about the shim.
        shell: cmd
        run: |
          python install\make_windows_shims.py --check
          bin\chamnan-map.cmd --help
          bin\chamnan-context.cmd --detect .

      - name: The preflight runs where there is no POSIX shell
        if: runner.os == 'Windows'
        shell: cmd
        run: install\chamnan-check.cmd
